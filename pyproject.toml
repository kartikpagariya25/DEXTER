[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexter-cli"
version = "1.1.0"
description = "A local-first, agentic application security assessment CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dexter = "dexter.cli:main"
wakeupdexter = "dexter.dashboard:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dexter = ["wordlists/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
